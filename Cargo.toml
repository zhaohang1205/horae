[package]
name = "horae"
version = "0.1.1"
edition = "2021"
description = "GTD terminal task manager (data layer + CLI), with time-datafication and a tag system"
license = "GPL-3.0"
readme = "docs/README_en.md"
repository = "https://github.com/zhaohang1205/horae"
rust-version = "1.89"
keywords = ["gtd", "todo", "tui", "task-manager", "pomodoro"]
categories = ["command-line-utilities"]

[dependencies]
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "1"
dirs = "5"
ratatui = { version = "0.30", default-features = false, features = ["crossterm", "layout-cache", "underline-color"] }
crossterm = "0.29"
unicode-width = "0.2"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3.27.0"

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
opt-level = "z"
