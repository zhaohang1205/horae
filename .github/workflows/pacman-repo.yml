name: Pacman Repository

on:
  release:
    types: [published]
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-pacman-repo:
    name: Build & Deploy Pacman Repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build repository in Arch Linux container
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE":/workspace \
            -w /workspace \
            archlinux:base-devel bash -c "
              pacman -Syu --noconfirm pacman-contrib git
              useradd -m builder
              echo 'builder ALL=(ALL) NOPASSWD: ALL' >> /etc/sudoers
              chown -R builder:builder /workspace
              su - builder -c 'cd /workspace && ./scripts/build-pacman-repo.sh'
            "

      - name: Deploy to GitHub Pages (gh-pages branch)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist/pacman
          publish_branch: gh-pages
          force_orphan: false
