[package]
name = "horae"
version = "0.1.1"
edition = "2021"
rust-version = "1.89"
license = "GPL-3.0"
description = "GTD terminal task manager (data layer + CLI), with time-datafication and a tag system"
readme = "../../docs/README_en.md"
repository = "https://github.com/zhaohang1205/horae"
keywords = ["gtd", "todo", "tui", "task-manager", "pomodoro"]
categories = ["command-line-utilities"]
default-run = "horae"

[[bin]]
name = "horae"
path = "src/main.rs"

[dependencies]
horae-core = { path = "../horae-core" }
horae-tui = { path = "../horae-tui" }
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
comfy-table = { version = "7", default-features = false, features = ["crossterm"] }
arboard = "3"
mimalloc = "0.1.52"

[dev-dependencies]
horae-core = { path = "../horae-core", features = ["test-util"] }
assert_cmd = "2"
predicates = "3"
tempfile = "3.27"
