[package]
name = "horae-core"
version = "0.2.5"
edition = "2021"
rust-version = "1.89"
license = "GPL-3.0"
description = "Core library for the horae GTD task manager: SQLite data layer, scheduling engine, recurrence rules (RRULE), and time parsing. Written in Rust."
repository = "https://github.com/zhaohang1205/horae"
keywords = ["gtd", "productivity", "sqlite", "scheduling", "task-manager"]
categories = ["command-line-utilities", "database"]

[dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
dirs = "5"
ureq = { version = "2", default-features = false, features = ["tls"] }
sha2 = "0.10"
hmac = "0.12"
base64 = "0.22"
tungstenite = { version = "0.30", default-features = false, features = ["rustls-tls-webpki-roots", "handshake", "url"] }
url = "2"
tempfile = { version = "3.27", optional = true }
notify-rust = "4.18.2"
libc = "0.2"

[dev-dependencies]
tempfile = "3.27"

[features]
test-util = ["dep:tempfile"]
