[package]
name = "horae-gui"
version = "0.1.1"
description = "Tauri + Svelte GUI for horae (GTD task manager)"
edition = "2021"
rust-version = "1.89"
license = "GPL-3.0"
repository = "https://github.com/zhaohang1205/horae"

[lib]
name = "horae_gui"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
horae-core = { path = "../../horae-core" }

[features]
# this feature is used for production builds where `custom-protocol` is enabled
custom-protocol = ["tauri/custom-protocol"]

[dev-dependencies]
tempfile = "3.27"
