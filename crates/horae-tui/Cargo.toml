[package]
name = "horae-tui"
version = "0.2.6"
edition = "2021"
rust-version = "1.89"
license = "GPL-3.0"
description = "Ratatui TUI frontend for the horae GTD task manager. Keyboard-driven, Catppuccin theme, bilingual (EN/ZH). Written in Rust."
repository = "https://github.com/zhaohang1205/horae"
keywords = ["tui", "ratatui", "gtd", "productivity", "task-manager"]
categories = ["command-line-utilities"]

[dependencies]
horae-core = { path = "../horae-core", version = "0.2.6" }
ratatui = { version = "0.30", default-features = false, features = ["crossterm", "layout-cache", "underline-color"] }
crossterm = "0.29"
unicode-width = "0.2"
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
uuid = { version = "1", features = ["v4"] }
rusqlite = { version = "0.32", features = ["bundled"] }
libc = "0.2"

[dev-dependencies]
horae-core = { path = "../horae-core", version = "0.2.6", features = ["test-util"] }
tempfile = "3.27"
